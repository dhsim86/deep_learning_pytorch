[project]
name = "deep-learning-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "gensim>=4.4.0",
    "ipython>=9.15.0",
    "konlpy>=0.6.0", # 한국어 자연어 처리를 위한 형태소 분석기 패키지
    "kss>=6.0.6",
    "matplotlib>=3.10.3", #  데이터를 차트(chart)나 플롯(plot)으로 시각화하는 패키지
    "nltk>=3.9.1", # 자연어 처리를 위한 파이썬 패키지
    "numpy>=2.3.1", # 수치 데이터를 다루는 파이썬 패키지
    "pandas>=2.3.1", # 파이썬 데이터 처리를 위한 라이브러리
    "pyqt6>=6.9.1", # matplotlib을 시각화할 때 사용
    "scikit-learn>=1.7.1", # 머신러닝을 위한 파이썬 패키지 # torch
    "sentence-transformers>=6.0.0",
    "seqeval>=1.2.2",
    "spacy>=3.8.14",
    "torch~=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.67.1",
    "transformers>=5.14.1",
]

# torch CUDA index
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
# if the system is not macOS, use the CUDA index
torch = [
  { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }
]
